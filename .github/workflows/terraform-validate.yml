name: Terraform Validate & Plan
on:
  pull_request:
    branches: [deployment]
    paths: [infra/**]

# prevents simultaneous plan race condition
concurrency:
    group: terraform-${{ github.head_ref }} 
    cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform Init (no backend)
        run: terraform -chdir=infra init -backend=false
      - name: Terraform Format Check
        run: terraform -chdir=infra fmt -check
      - name: Terraform Validate
        run: terraform -chdir=infra validate

  plan:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # Required for WIF OIDC token
      pull-requests: write # Required to post plan output as PR comment
    env:
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v6.0.3

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform -chdir=infra init -input=false

      - name: Terraform Plan
        id: plan
        run: terraform -chdir=infra plan -no-color -input=false
        continue-on-error: true

      - name: Post Plan to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const planOutcome = '${{ steps.plan.outcome }}';
            const stdout = `${{ steps.plan.outputs.stdout }}`;
            const stderr = `${{ steps.plan.outputs.stderr }}`;

            let body;
            if (planOutcome === 'failure') {
              body = `#### Terraform Plan Failed
            \`\`\`
            ${stderr}
            \`\`\`
            *Triggered by @${{ github.actor }}*`;
            } else {
              body = `#### Terraform Plan
            \`\`\`
            ${stdout}
            \`\`\`
            *Triggered by @${{ github.actor }}*`;
            }

            // Delete previous bot comments to keep PR timeline clean
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const comment of comments) {
              if (comment.user.type === 'Bot' && (comment.body.includes('Terraform Plan') || comment.body.includes('Terraform Plan Failed'))) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body.substring(0, 65536)
            });

      - name: Fail on Plan Error
        if: steps.plan.outcome == 'failure'
        run: exit 1
