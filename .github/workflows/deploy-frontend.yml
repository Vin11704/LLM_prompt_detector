name: Deploy Frontend 

on: 
  push:
    branches: 
    - deployment
    paths:
    - "frontend/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for WIF

    env: 
      REGION: asia-southeast1
      SERVICE: llmsecurity-frontend
      IMAGE: asia-southeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/llmsecurity/llmsecurity-frontend

    steps:
    - uses: actions/checkout@v6.0.3
    - id: auth
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
        service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
    
    - name: configure docker
      run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet
    
    - name: build and push
      run: |
        docker build --build-arg VITE_API_URL=${{ secrets.BACKEND_URL }} -t ${{ env.IMAGE }}:${{ github.sha }} -t ${{ env.IMAGE }}:latest -f frontend/Dockerfile frontend/
        docker push ${{ env.IMAGE }} --all-tags

    - name: deploy to cloud run
      uses: google-github-actions/deploy-cloudrun@v3
      with: 
        region: ${{ env.REGION }}
        service: ${{ env.SERVICE }}
        image: ${{ env.IMAGE }}:${{ github.sha }}
